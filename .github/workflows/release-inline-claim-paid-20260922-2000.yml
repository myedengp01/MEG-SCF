name: Release SCF Inline Claim Paid 20260922-2000
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-inline-claim-paid-20260922-2000.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Guarded SCF inline integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          old='v2026.09.20:13:30';new='v2026.09.22-20:00'
          assert old in s and s.count('async function renderBrowseSubmissionsList()')==1
          assert s.count('async function renderPayrollViewerList()')==1
          assert s.count('async function deleteSubmission(id)')==1
          assert 'universal-payment-inline.js?v=20260922-2000' not in s
          # The existing legacy Delete button must not directly invoke a raw table delete.
          assert s.count('onclick="deleteSubmission(\'${sub.id}\')"')==1
          s=s.replace('onclick="deleteSubmission(\'${sub.id}\')"','data-meg-scf-delete="true" style="display:none;font-size:12px;" onclick="event.stopPropagation();window.megScfAdminDelete(\'${sub.id}\')"',1)
          # Replace duplicate style attributes from the original Delete button with one style.
          s=s.replace('class="manage-delete-btn" style="font-size:12px;" data-meg-scf-delete','class="manage-delete-btn" data-meg-scf-delete',1)
          browse='''    <div class="manage-list-item" style="flex-direction:column;align-items:flex-start;gap:4px;">'''
          assert s.count(browse)==1
          s=s.replace(browse,'''    <div class="manage-list-item" data-meg-scf-row="true" style="flex-direction:column;align-items:flex-start;gap:4px;">''',1)
          old_actions='''        <button class="manage-delete-btn" data-meg-scf-delete="true" style="display:none;font-size:12px;" onclick="event.stopPropagation();window.megScfAdminDelete('${sub.id}')">🗑 Delete</button>'''
          assert s.count(old_actions)==1
          s=s.replace(old_actions,old_actions+'''\n        <span data-meg-scf-id="${sub.id}" data-meg-scf-local-paid="${sub.payment_confirmed===true}" data-meg-scf-admin="true" style="display:inline-flex;align-items:center;flex-wrap:wrap;gap:3px;">Checking payment status…</span>''',1)
          # Payroll list is read-only; display canonical payment status beside the claim title.
          payroll='''    <div class="manage-list-item" style="flex-direction:column;align-items:flex-start;gap:4px;cursor:pointer;" onclick="togglePayrollClaimDetail('${row.id}')">'''
          assert s.count(payroll)==1
          s=s.replace(payroll,'''    <div class="manage-list-item" data-meg-scf-row="true" style="flex-direction:column;align-items:flex-start;gap:4px;cursor:pointer;" onclick="togglePayrollClaimDetail('${row.id}')">''',1)
          title='''        <span style="font-weight:600;">${escapeHtml(row.claimed_by)} — ${escapeHtml(row.serial_no)}</span>'''
          assert s.count(title)==1
          s=s.replace(title,title+'''\n        <span data-meg-scf-id="${row.id}" data-meg-scf-local-paid="${row.payment_confirmed===true}" data-meg-scf-admin="false" style="display:inline-flex;align-items:center;flex-wrap:wrap;gap:3px;" onclick="event.stopPropagation()">Checking payment status…</span>''',1)
          # Existing SCF undo/payment handlers stay intact; no generic 60-day bypass.
          assert s.count("db.rpc('scf_set_payment_status'")==0
          assert '</body>' in s
          s=s.replace(old,new)
          s=s.replace('</body>','<script src="./universal-payment-inline.js?v=20260922-2000" defer></script>\n</body>',1)
          assert s.count('universal-payment-inline.js?v=20260922-2000')==1
          assert s.count('data-meg-scf-id=')==2
          assert s.count('data-meg-scf-delete=')==1
          p.write_text(s,encoding='utf-8')
          Path('version.json').write_text(json.dumps({'version':new,'uvn':new},indent=2)+'\n',encoding='utf-8')
          assert json.loads(Path('version.json').read_text())['uvn']==new
          PY
          node --check universal-payment-inline.js
          git diff --check
          git add index.html version.json universal-payment-inline.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || (git commit -m 'release(SCF): inline Claim Paid, payment date and Admin Delete v2026.09.22-20:00' && git push origin main)
