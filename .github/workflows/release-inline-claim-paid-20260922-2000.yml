name: Release SCF Inline Claim Paid 20260922-2000
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-inline-claim-paid-20260922-2000.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Apply guarded SCF inline release and verify
        run: |
          python3 tools/release_scf_inline_20260922.py
          node --check universal-payment-inline.js
          git diff --check
          git add index.html version.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || (git commit -m 'release(SCF): inline Claim Paid and guarded Delete v2026.09.22-20:00' && git push origin main)
